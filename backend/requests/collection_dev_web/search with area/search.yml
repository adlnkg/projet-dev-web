info:
  name: search
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/search?keywords=thermostat&building=Turing&type=device
  params:
    - name: keywords
      value: thermostat
      type: query
    - name: building
      value: Turing
