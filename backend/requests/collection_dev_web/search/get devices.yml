info:
  name: get devices
  type: http

http:
  method: GET
  url: http://localhost:3000/api/devices/search/?keywords&type
  params:
    - name: keywords
      value: ""
      type: query
    - name: type
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
